<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNI-PROXY :: Ethereal Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Uniqueness: Favicon - maybe a simple ASCII character or a glitchy pixel art -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>">
</head>
<body>
    <header>
        <h1>UNI-PROXY</h1>
        <p>:: Your Portal to Uncharted Webs ::</p>
    </header>

    <div class="container">
        <form id="urlInputForm" class="url-input-form">
            <label for="urlInput">Destination Address:</label>
            <input type="text" id="urlInput" name="url" placeholder="Enter destination..." autocomplete="off" spellcheck="false">

            <div class="options">
                <label for="transportSelect">Transport Protocol:</label>
                <select id="transportSelect" name="transport">
                    <option value="wisp" selected>Wisp (Default)</option>
                    <option value="scramjet">Scramjet (Experimental)</option>
                    <option value="bare">Bare (Optional)</option>
                </select>
            </div>
            <button type="submit">Engage Hyperlink Engine</button>
        </form>

        <div id="proxyFrameContainer" class="proxy-frame-container">
            <iframe id="proxyFrame" class="proxy-frame" name="proxyFrame" sandbox="allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation allow-top-navigation-by-user-activation"></iframe>
            <!--
                Sandbox attributes are important for security when iframing external content.
                "allow-scripts" and "allow-same-origin" are needed for the proxied content to function.
                The exact set of sandbox attributes might need adjustment based on typical proxied site requirements.
                However, for a Wisp/Scramjet proxy, the content within the iframe is rewritten and served
                from our domain, so "allow-same-origin" becomes less of an issue and more of a requirement
                for the proxy's own client-side scripts to interact with the iframe content.
            -->
        </div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> UNI-PROXY Systems. All realities reserved and unreserved.</p>
        <p>STATUS: <span style="color: #00ff00;">OPERATIONAL</span> :: MODE: <span id="currentMode">WISP</span></p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const transportSelect = document.getElementById('transportSelect');
        const currentModeDisplay = document.getElementById('currentMode');
        transportSelect.addEventListener('change', (e) => {
            currentModeDisplay.textContent = e.target.value.toUpperCase();
        });
    </script>
</body>
</html>
